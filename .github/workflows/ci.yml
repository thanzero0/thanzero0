name: Daily Activity Sync

on:
  schedule:
    # Runs daily at 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize build metrics
        run: |
          mkdir -p .github/data
          METRICS_FILE=".github/data/metrics.json"

          ISO_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"last_sync\":\"$ISO_DATE\",\"status\":\"ok\"}" > "$METRICS_FILE"

          MESSAGES=(
            "chore(deps): sync workspace telemetry data"
            "ci: update routine build cache metrics"
            "docs: sync workspace activity log"
            "style: update formatting guidelines telemetry"
            "chore: routine environment maintenance check"
            "ci: refresh automated health check telemetry"
          )

          RAND_IDX=$(( RANDOM % ${#MESSAGES[@]} ))
          COMMIT_MSG="${MESSAGES[$RAND_IDX]}"

          git config --global user.name "thanzeroo"
          git config --global user.email "thanzero7@gmail.com"

          git add "$METRICS_FILE"

          if ! git diff --staged --quiet; then
            git commit -m "$COMMIT_MSG"
            git push origin HEAD:${{ github.ref }}
          fi
